name: Release (Windows & Android)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS DESKTOP
  # =========================================================================
  release-windows:
    name: Desktop (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri

      - name: Install desktop npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "Plenum ${{ github.ref_name }}"
          releaseBody: "Release ${{ github.ref_name }} of Plenum."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  # =========================================================================
  # 2. BUILD ANDROID (Flutter + Cargokit)
  # =========================================================================
  release-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Rust toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/upload-keystore.jks
            cat <<EOF > mobile/android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../app/upload-keystore.jks
          EOF
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; falling back to debug signing."
          fi

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Split APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Stage & Rename Android Artifacts
        run: |
          mkdir -p staged-android
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk staged-android/Plenum-android-arm64-v8a.apk
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk staged-android/Plenum-android-armeabi-v7a.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk staged-android/Plenum-android-universal.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab staged-android/Plenum-android.aab

      - name: Upload Android Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: staged-android/*
          tag_name: ${{ github.ref_name }}
          draft: true

  # =========================================================================
  # 3. FINALIZE RELEASE
  # =========================================================================
  publish-release:
    name: Finalize & Publish Release
    needs: [release-windows, release-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
