name: CI (Windows & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # 1. DESKTOP & RUST CORE (Windows)
  # =========================================================================
  desktop-windows:
    name: Desktop (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri

      - name: Install desktop npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: desktop
        run: npm run build

      - name: Test Rust workspace
        run: cargo test --workspace --exclude mobile_rust

  # =========================================================================
  # 2. MOBILE (Android)
  # =========================================================================
  mobile-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Rust toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter codebase
        working-directory: mobile
        run: flutter analyze

      - name: Build Android Debug APK (verifies Cargokit & NDK compilation)
        working-directory: mobile
        run: flutter build apk --debug
